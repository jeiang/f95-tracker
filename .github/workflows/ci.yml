name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # No cache push yet: garret push waits for the dotfiles garret OIDC entry (R-DEP-8).
      - run: nix flake check -L
